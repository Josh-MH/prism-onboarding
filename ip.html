<!doctype html><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'"><title>Prism LAN diagnostic</title><body style="font:16px system-ui;padding:3rem;background:#08111b;color:#f2f7f7"><h1>Prism LAN diagnostic</h1><pre id="result">Checking browser ICE candidates…</pre><script>
(async()=>{const result=document.getElementById('result');try{const pc=new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'}]});pc.createDataChannel('probe');await pc.setLocalDescription(await pc.createOffer());await new Promise(resolve=>{if(pc.iceGatheringState==='complete')return resolve();let timeout=setTimeout(resolve,8000);pc.addEventListener('icegatheringstatechange',()=>{if(pc.iceGatheringState==='complete'){clearTimeout(timeout);resolve()}})});const stats=await pc.getStats();const candidates=[...stats.values()].filter(s=>s.type==='local-candidate').map(s=>({type:s.candidateType,address:s.address,relatedAddress:s.relatedAddress}));result.textContent=JSON.stringify(candidates,null,2);pc.close()}catch(e){result.textContent=e.name+': '+e.message}})();
</script></body>
