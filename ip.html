<!doctype html><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'"><title>Prism LAN diagnostic</title><body style="font:16px system-ui;padding:3rem;background:#08111b;color:#f2f7f7"><h1>Prism LAN diagnostic</h1><button id="test">Choose a screen to test address access</button><pre id="result">Ready.</pre><script>
document.getElementById('test').onclick=async()=>{const result=document.getElementById('result');let stream,pc;try{stream=await navigator.mediaDevices.getDisplayMedia({video:true});pc=new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'}]});stream.getTracks().forEach(t=>pc.addTrack(t,stream));await pc.setLocalDescription(await pc.createOffer());await new Promise(resolve=>{if(pc.iceGatheringState==='complete')return resolve();let timeout=setTimeout(resolve,8000);pc.addEventListener('icegatheringstatechange',()=>{if(pc.iceGatheringState==='complete'){clearTimeout(timeout);resolve()}})});const stats=await pc.getStats();const candidates=[...stats.values()].filter(s=>s.type==='local-candidate').map(s=>({type:s.candidateType,address:s.address,relatedAddress:s.relatedAddress}));result.textContent=JSON.stringify(candidates,null,2)}catch(e){result.textContent=e.name+': '+e.message}finally{stream?.getTracks().forEach(t=>t.stop());pc?.close()}};
</script></body>
