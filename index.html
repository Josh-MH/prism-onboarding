</style></head><body><main class="card"><div class="brand">PRISM</div><h1>Share your screen</h1><p>Choose a Chrome tab, a window, or your entire screen. It will appear on the selected Prism display until you stop sharing.</p><div id="status" class="status" role="status" aria-live="polite">Checking invitation…</div><div class="actions"><button id="start" disabled>Choose what to share</button><button id="stop" class="secondary" disabled>Stop sharing</button></div><p class="small">Chrome asks you to approve the source each time. Keep this page open while sharing.</p></main><script>
(()=>{'use strict';const status=document.getElementById('status'),start=document.getElementById('start'),stop=document.getElementById('stop');const parts=location.hash.slice(1).split('.');history.replaceState(null,'',location.pathname);const id=parts.shift(),invite=parts.join('.');let session='',stream=null,peer=null,timer=0,closed=false;const api=async(action,extra={})=>{const r=await fetch('https://szjlowelnukjetjzizww.supabase.co/functions/v1/prism-share',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,id,...extra})});const x=await r.json();if(!r.ok)throw Error(x.error||'Share service unavailable');return x};const set=s=>status.textContent=s;const gather=pc=>new Promise(resolve=>{if(pc.iceGatheringState==='complete')return resolve();const done=()=>{pc.removeEventListener('icegatheringstatechange',check);clearTimeout(t);resolve()};const check=()=>{if(pc.iceGatheringState==='complete')done()};pc.addEventListener('icegatheringstatechange',check);const t=setTimeout(done,12000)});const finish=async(send=true)=>{if(closed)return;closed=true;clearInterval(timer);start.disabled=true;stop.disabled=true;stream?.getTracks().forEach(t=>t.stop());peer?.close();if(send&&session)try{await api('stop',{session})}catch{}set('Sharing stopped. This link cannot be reused.')};
if(!/^[0-9a-f-]{36}$/i.test(id||'')||!/^[0-9a-f]{64}$/.test(invite||'')){set('This share link is incomplete. Ask your agent for a new one.');return}start.disabled=false;set('Ready. Choose what to share.');
start.onclick=async()=>{start.disabled=true;set('Choose a tab, window, or screen in Chrome…');try{stream=await navigator.mediaDevices.getDisplayMedia({video:{frameRate:30},audio:true,selfBrowserSurface:'exclude',surfaceSwitching:'include'});const redeemed=await api('redeem',{invite});session=redeemed.session;stop.disabled=false;stream.getVideoTracks()[0].addEventListener('ended',()=>void finish());peer=new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'}]});for(const track of stream.getTracks())peer.addTrack(track,stream);peer.oniceconnectionstatechange=()=>{if(peer&&peer.iceConnectionState!=='connected')set('ICE '+peer.iceConnectionState+' · '+peer.connectionState)};peer.onconnectionstatechange=()=>{if(peer?.connectionState==='connected')set('Sharing to '+redeemed.displayName+'.');if(['failed','closed'].includes(peer?.connectionState))void finish()};const offer=await peer.createOffer();await peer.setLocalDescription(offer);await gather(peer);const lanIp=new URLSearchParams(location.search).get('lanIp');const localOffer=peer.localDescription;const description=lanIp&&/^(?:\d{1,3}\.){3}\d{1,3}$/.test(lanIp)?{type:localOffer.type,sdp:localOffer.sdp.replace(/(?<=\s)[0-9a-f-]+\.local(?=\s)/gi,lanIp)}:localOffer;await api('offer',{session,description});set('Connecting to '+redeemed.displayName+'…');timer=setInterval(async()=>{try{const reply=await api('poll',{session});if(reply.status==='ended')return void finish(false);if(reply.answer&&!peer.currentRemoteDescription){await peer.setRemoteDescription(reply.answer);set('Connecting video…')}}catch(e){set(e.message||'Connection interrupted')}} ,850)}catch(e){stream?.getTracks().forEach(t=>t.stop());set(e.name==='NotAllowedError'?'Screen sharing was cancelled.':e.message||'Could not start sharing.');start.disabled=!!session}};
stop.onclick=()=>void finish();addEventListener('pagehide',()=>void finish());
})();
</script></body></html>
